services:
  - type: web
    name: euromotion-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
