# render.yaml — deploys the FastAPI backend on Render.
# In Render: New + → Blueprint → connect this repo. It reads this file.
services:
  - type: web
    name: euromotion-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: AI_PROVIDER
        value: mistral
      - key: MISTRAL_API_KEY
        sync: false        # set this secret in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false        # e.g. https://your-frontend.vercel.app
